<div class="modal-backdrop" *ngIf="visible" (click)="backdropClick($event)">
    <div class="modal-wrapper" [ngClass]="size" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <header class="modal-header">
            <h3 id="modal-title">{{title}}</h3>
            <button class="btn-close" (click)="onClose()" aria-label="true" aria-labelledby="modal-title">X</button>
        </header>
        <section class="modal-body">
            <ng-content></ng-content>
        </section>
        <footer class="modal-footer">
            <button class="btn secondary" (click)="onClose()">Cerrar</button>
            <button class="btn secondary" (click)="onClose()">Aceptar</button>
        </footer>
    </div>
</div>

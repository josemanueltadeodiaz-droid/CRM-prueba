<!-- Contenedor principal con imagen de fondo panorámica -->
<div class="landing-container">
  <!-- Imagen de fondo panorámica -->
  <div class="landing-bg">
    <img
      src="/imagen4.jpeg"
      alt="Equipo colaborando en gestión empresarial"
      class="landing-bg-img"
    />
    <!-- Overlay con gradiente para mejorar legibilidad del texto -->
    <div class="landing-overlay"></div>
  </div>

  <!-- Contenido flotante sobre la imagen -->
  <div class="landing-content">
    <div class="w-full lg:w-1/2 flex justify-center lg:justify-end lg:pr-6 mt-12 lg:mt-0">

      <!-- Contenedor del contenido principal -->
      <div class="max-w-2xl lg:max-w-3xl space-y-2 animate-slide-in-left">

        <h1 class="text-4xl lg:text-5xl xl:text-6xl font-bold text-white leading-tight text-shadow-strong texto">
          Gestión Optimaa
        </h1>

        <span class="text-yellow-custom text-4xl lg:text-5xl xl:text-6xl font-bold leading-tight text-shadow-strong texto">
          Resultados Extraordinarios y eficientes
        </span>

        <app-ui-tipografia
          variante="h2"
          texto="Transforma la colaboración en productividad activa"
          color="text-red-50">
        </app-ui-tipografia>

        <div class="bg">
          <app-ui-tipografia
            variante="p-lg"
            texto="Potencia la eficiencia de tu equipo con herramientas diseñadas para optimizar cada proceso.
            Desde la gestión de proyectos hasta la comunicación fluida entre áreas, todo en una plataforma
            intuitiva que impulsa la innovación y los resultados de tu empresa."
            color="text-red-50">
          </app-ui-tipografia>
        </div>

        <app-ui-tipografia
          variante="h3"
          texto="Capacitacion, asesoria, buen servicio"
          color="text-red-50">
        </app-ui-tipografia>

        <!-- Características -->
        <div class="grid md:grid-cols-2 gap-4 pt-6 max-w-2xl">

          <div class="glass-card flex items-start space-x-3">
            <svg class="w-6 h-6 text-blue-custom" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
            </svg>
            <div>
              <h3 class="font-semibold text-gray-900">Gestión Eficiente</h3>
              <p class="text-sm text-gray-600">Organiza tareas y proyectos en tiempo real</p>
            </div>
          </div>

          <div class="glass-card flex items-start space-x-3">
            <svg class="w-6 h-6 text-yellow-custom" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 20h5v-2a3 3 0 00-5.356-1.857"/>
            </svg>
            <div>
              <h3 class="font-semibold text-gray-900">Colaboración Total</h3>
              <p class="text-sm text-gray-600">Conecta equipos y mejora la comunicación</p>
            </div>
          </div>

          <div class="glass-card flex items-start space-x-3">
            <svg class="w-6 h-6 text-blue-custom" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
            <div>
              <h3 class="font-semibold text-gray-900">Optimización Continua</h3>
              <p class="text-sm text-gray-600">Automatiza procesos y ahorra tiempo</p>
            </div>
          </div>

          <div class="glass-card flex items-start space-x-3">
            <svg class="w-6 h-6 text-yellow-custom" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 19v-6a2 2 0 00-2-2H5"/>
            </svg>
            <div>
              <h3 class="font-semibold text-gray-900">Resultados Medibles</h3>
              <p class="text-sm text-gray-600">Analiza métricas y toma decisiones</p>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Carrusel (si lo necesitas) -->
  <div class="carrusel-container">
    <img [src]="imagenActual" alt="Imagen Carrusel" class="carrusel-img"/>
  </div>

  <div class="carrusel-indicadores">
    <span
      *ngFor="let img of imagenesCarrusel; let i = index"
      [class.activo]="i === indiceActual"
      (click)="seleccionarImagen(i)">
    </span>
  </div>

  <!-- LOGO FIJO ABAJO DERECHA -->
  <div class="logo-fixed">
    <model-viewer
        ar
        ar-modes="scene-viewer quick-look"
        camera-controls
        touch-action="pan-y"
        auto-rotate
        src="/logo3d.glb"
        poster="/logo.png"
        shadow-intensity="3"
        camera-orbit="90deg 60deg 2m">
      </model-viewer>
  </div>

</div>
